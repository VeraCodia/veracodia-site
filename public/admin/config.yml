

backend:
  name: github
  repo: VeraCodia/veracodia-site 
  branch: main
  local_backend: true

media_folder: "public/assets/images" # Location where files will be stored in the repo
public_folder: "/assets/images" # The src attribute for uploaded media

collections:
  - name: "event" # Used in routes, e.g., /admin/collections/blog
    label: "Event" # Used in the UI
    folder: "src/content/event" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    fields: # The fields for each document, usually in frontmatte
      - { label: "Title", name: "title", widget: "string"}
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Images", name: "images", widget: "list", required: false ,field: {label: Image, name: image, widget: image}  }

